services:
  - type: web
    name: smart-steel-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://smart-steel-web.onrender.com
      - key: REDIS_ENABLED
        value: false

  - type: web
    name: smart-steel-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-steel-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://smart-steel-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
